# flora 站点 · Caddy 片段（2026-09-01 部署批次）
# 形态：主域 Host 分流——luckyducky.cloud 走 flora 应用，IP 直访照旧占位页（验收5）。
# HTTPS 未启用：域名备案未核实（总览.md），备案过后将 site 块改域名即可自动签发。
# flora.luckyducky.cloud 子域 DNS 记录尚未添加；加好后在下面取消注释即可切换。

# ── 替换 :80 站点为以下内容（保留占位页兜底） ──
:80 {
	# flora：主域（DNS 已指向本机）
	@flora host luckyducky.cloud
	handle @flora {
		reverse_proxy 127.0.0.1:3000
	}

	# flora 子域（DNS 记录添加后取消注释）
	# @florasub host flora.luckyducky.cloud
	# handle @florasub {
	# 	reverse_proxy 127.0.0.1:3000
	# }

	# 其余（IP 直访）照旧占位页
	handle {
		root * /var/www/default
		file_server
	}
}
